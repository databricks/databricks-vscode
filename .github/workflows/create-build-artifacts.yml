name: Create Build Artifacts

on:
    workflow_call:

jobs:
    create-build-artifacts:
        runs-on:
            group: databricks-protected-runner-group
            labels: linux-ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
            - name: Obtain JFrog OIDC token
              run: bash .github/scripts/jfrog-oidc-token.sh
            - name: Configure JFrog npm registry
              run: bash .github/scripts/configure-npm.sh
            - run: yarn install --immutable
            - run: yarn build
            # A VSIX per platform, each with that platform's CLI (scripts/packageVsix.mjs).
            # The package script marks them pre-release while 3.x is in pre-release.
            - name: Package the VSIXs
              working-directory: packages/databricks-vscode
              run: |
                  for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
                      yarn package --target "$target"
                  done
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: databricks
                  path: packages/databricks-vscode/.build/*.vsix
                  # `.build` is a hidden folder, which upload-artifact leaves out by default.
                  include-hidden-files: true
                  if-no-files-found: error
