name: Secret masking tests

on:
    pull_request:

permissions:
    contents: read

jobs:
    secret-masking:
        name: Credential scripts mask secrets
        runs-on:
            group: databricks-protected-runner-group
            labels: linux-ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run secret masking regression test
              run: bash .github/scripts/tests/secret-masking.sh
