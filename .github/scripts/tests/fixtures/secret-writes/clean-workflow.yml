# Must pass: masked, auto-masked, literal and allow-listed writes.
name: fixture
on: pull_request
jobs:
  fixture:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - id: login
        run: |
          TOKEN=$(./login.sh)
          echo "::add-mask::$TOKEN"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"
      - run: |
          echo "::add-mask::${{ steps.login.outputs.token }}"
          echo "API_TOKEN=${{ steps.login.outputs.token }}" >> $GITHUB_ENV
      - run: echo "DEPLOY_KEY=${{ secrets.DEPLOY_KEY }}" >> $GITHUB_ENV
      - run: |
          echo "has_token=true" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          echo "key_id=$KEY_ID" >> $GITHUB_OUTPUT # secret-write-ok: public key ID, not the key
      - run: echo "::add-mask::$INLINE_TOKEN" && echo "INLINE_TOKEN=$INLINE_TOKEN" >> $GITHUB_ENV
